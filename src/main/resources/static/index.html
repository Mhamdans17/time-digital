<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Time Service</title>
    <link href="https://fonts.googleapis.com/css2?family=Arimo:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Arimo', sans-serif; /* ganti font ke Arimo */
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #4facfe, rgba(140, 254, 0, 0.85));
            overflow: hidden;
        }

        .card {
            font-family: 'Arimo', sans-serif; /* pastikan ini ada */
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            padding: 2rem;
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.2);
            text-align: center;
            position: relative;
            z-index: 1;
        }

        h1 {
            margin: 0.5rem 0;
            color: #fff;
            font-family: 'Arimo', sans-serif; /* judul juga pakai Arimo */
            font-weight: 400;
            font-size: 2.1rem;
        }

        h2 {
            margin: 0.5rem 0;
            color: #fff;
            font-weight: 300;
            font-size: 1.8rem;
        }

        h3 {
            margin: 0.5rem 0;
            color: #fff;
            font-weight: 200;
            font-size: 1.2rem;
        }

        button {
            margin-top: 1rem;
            padding: 0.6rem 1.2rem;
            border: none;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.3);
            color: #fff;
            font-weight: 300;
            font-family: 'Arimo', sans-serif;
            cursor: pointer;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }

        button:hover {
            background: rgba(255, 255, 255, 0.5);
            color: #333;
        }

        .sphere {
            position: absolute;
            width: 150px;
            height: 150px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            animation: float 6s ease-in-out infinite;
        }

        .sphere:nth-child(1) { top: 10%; left: 10%; animation-delay: 0s; }
        .sphere:nth-child(2) { top: 20%; right: 10%; animation-delay: 2s; }
        .sphere:nth-child(3) { bottom: 10%; left: 20%; animation-delay: 4s; }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }
    </style>
</head>
<body>
<div class="card">
    <h1>Waktu Sekarang</h1>
    <h2 id="time">--:--:--</h2>
    <h2 id="date">----</h2>
    <h3 id="timezone">----</h3>
    <button onclick="fetchTime()">Segarkan</button>
</div>
<div class="sphere"></div>
<div class="sphere"></div>
<div class="sphere"></div>

<script>
    async function fetchTime() {
        try {
            const res = await fetch('/api/time');
            const data = await res.json();
            document.getElementById('time').innerText = data.time;
            document.getElementById('date').innerText = data.date;
            document.getElementById('timezone').innerText = data.timezone;
        } catch (err) {
            console.error(err);
            alert('Gagal mengambil waktu.');
        }
    }

    // Auto-refresh setiap detik
    fetchTime();
    setInterval(fetchTime, 1000);
</script>
</body>
</html>
